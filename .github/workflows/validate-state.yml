name: Validate State

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate agents-state.json
        run: node scripts/validate-state.js

      - name: Test Coordination Tower & Handoff Suite
        run: node scripts/test-tower.js

      - name: Run Security & Negative Validation Tests
        run: node scripts/test-validation.js

      - name: Run Accessibility & Modal Focus Trap Tests
        run: node scripts/test-a11y.js
