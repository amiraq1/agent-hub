<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b14" />
  <meta name="description" content="نبض الوكلاء | Nabd Agents — لوحة الحالة وسجل التسليم غير المتزامن" />
  <title>نبض الوكلاء | Nabd Agents — لوحة الحالة وسجل التسليم غير المتزامن</title>
  
  <link rel="manifest" href="assets/manifest.webmanifest" />
  
  <!-- Optimized Font Loading with subsetted weights & display=swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  
  <!-- Zero-Blocking Standalone Production CSS -->
  <link rel="stylesheet" href="assets/styles.min.css" />
  
  <!-- Critical CSS for CLS = 0.00 -->
  <style>
    body { background-color: #070b14; color: #e2e8f0; margin: 0; min-height: 100vh; overflow-x: hidden; }
    html[dir="rtl"] body { font-family: 'IBM Plex Sans Arabic', Inter, system-ui, -apple-system, sans-serif; }
    html[dir="ltr"] body { font-family: Inter, 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-grid">
  <!-- Top Navigation -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 glass-header">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between gap-3">
        <!-- Brand -->
        <button id="brandHomeBtn" type="button" class="flex items-center gap-2.5 text-start focus:outline-none">
          <div class="relative flex h-9 w-9 items-center justify-center rounded-xl bg-surface-900 border border-emerald-500/40">
            <svg class="h-5 w-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            <span class="absolute -top-1 -end-1 h-2.5 w-2.5 rounded-full bg-emerald-400 pulse-dot"></span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-base font-bold tracking-tight text-white" data-i18n="brandName">نبض الوكلاء</span>
              <span class="hidden sm:inline-flex items-center rounded-md bg-emerald-500/10 px-1.5 py-0.5 text-[10px] font-semibold text-emerald-300 border border-emerald-500/20">MVP v1.0</span>
            </div>
            <p class="text-[11px] text-slate-400 hidden sm:block" data-i18n="brandSub">Async-First Agent Ledger</p>
          </div>
        </button>

        <!-- Desktop Nav -->
        <nav id="desktopNav" class="hidden lg:flex items-center gap-1 rounded-xl bg-surface-900/90 p-1 border border-slate-800">
          <button type="button" data-view="overview" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium transition"></button>
          <button type="button" data-view="board" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium transition"></button>
          <button type="button" data-view="tasks" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium transition"></button>
          <button type="button" data-view="handoffs" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium transition"></button>
          <button type="button" data-view="pipeline" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium transition"></button>
          <button type="button" data-view="blueprint" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium transition"></button>
        </nav>

        <!-- Search & Right Controls -->
        <div class="flex items-center gap-2">
          <!-- Instant Search Input -->
          <div class="relative hidden sm:block w-48 md:w-64">
            <input id="globalSearchInput" type="search" placeholder="بحث... [/]" class="w-full rounded-lg bg-surface-950 border border-slate-800 px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:border-emerald-400 focus:outline-none" />
            <kbd class="absolute end-2 top-2 rounded bg-surface-900 border border-slate-700 px-1 font-mono text-[9px] text-slate-400 pointer-events-none">/</kbd>
          </div>

          <button id="alertsBtn" type="button" class="relative inline-flex items-center gap-1.5 rounded-lg border border-slate-700/80 bg-surface-900 px-2.5 py-1.5 text-xs font-medium text-slate-200 hover:border-amber-500/50 hover:text-white transition">
            <svg class="h-4 w-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="hidden sm:inline" data-i18n="alertsBtn">التنبيهات</span>
            <span id="alertsBadge" class="inline-flex h-5 min-w-[20px] items-center justify-center rounded-full bg-rose-500 px-1 text-[10px] font-bold text-white">0</span>
          </button>

          <button id="langToggleBtn" type="button" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-700/80 bg-surface-900 px-2.5 py-1.5 text-xs font-semibold text-cyan-300 hover:border-cyan-400/60 transition">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span id="langToggleLabel">EN</span>
          </button>

          <button id="mobileMenuBtn" type="button" class="lg:hidden inline-flex items-center justify-center rounded-lg border border-slate-700/80 bg-surface-900 p-2 text-slate-300 hover:text-white">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Nav -->
      <div id="mobileNav" class="hidden lg:hidden pb-3 pt-1 border-t border-slate-800/80">
        <div class="mb-2">
          <input id="mobileSearchInput" type="search" placeholder="بحث فوري في الوكلاء والمهام..." class="w-full rounded-lg bg-surface-950 border border-slate-800 px-3 py-1.5 text-xs text-slate-200 focus:border-emerald-400 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
          <button type="button" data-view="overview" class="nav-btn-mobile px-3 py-2 rounded-lg text-xs font-medium text-start transition"></button>
          <button type="button" data-view="board" class="nav-btn-mobile px-3 py-2 rounded-lg text-xs font-medium text-start transition"></button>
          <button type="button" data-view="tasks" class="nav-btn-mobile px-3 py-2 rounded-lg text-xs font-medium text-start transition"></button>
          <button type="button" data-view="handoffs" class="nav-btn-mobile px-3 py-2 rounded-lg text-xs font-medium text-start transition"></button>
          <button type="button" data-view="pipeline" class="nav-btn-mobile px-3 py-2 rounded-lg text-xs font-medium text-start transition"></button>
          <button type="button" data-view="blueprint" class="nav-btn-mobile px-3 py-2 rounded-lg text-xs font-medium text-start transition"></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Live GitHub Sync & Shortcuts Bar -->
  <div class="border-b border-slate-800/70 bg-surface-900/80">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 text-xs">
      <div class="flex flex-wrap items-center gap-2">
        <span id="liveStatusPill" class="inline-flex items-center gap-1.5 rounded-full border border-cyan-500/40 bg-cyan-500/15 px-2.5 py-0.5 text-[11px] font-semibold text-cyan-200">
          <span class="h-1.5 w-1.5 rounded-full bg-cyan-400"></span>
          <span>ذاكرة محلية سريعة</span>
        </span>
        <span id="liveLastSync" class="font-mono text-[11px] text-slate-400">amiraq1/agent-hub</span>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <span class="hidden md:inline font-mono text-[10px] text-slate-500" data-i18n="shortcutsHint">اختصارات: [ / ] بحث • [ R ] تحديث • [ 1-6 ] التبويبات • [ Esc ] إغلاق</span>
        <button id="syncLiveBtn" type="button" class="inline-flex items-center gap-1.5 rounded-lg bg-emerald-500/15 border border-emerald-500/40 px-3 py-1 text-[11px] font-semibold text-emerald-200 hover:bg-emerald-500/25 transition">
          <span id="syncLiveBtnLabel">↻ تحديث حي</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <main id="appMain" class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">
    <!-- Dynamic view injected here -->
  </main>

  <!-- Footer -->
  <footer class="mt-12 border-t border-slate-800/80 bg-surface-950/80 py-6">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
        <span data-i18n="footerCopy">نبض الوكلاء (Nabd Agents) — المنصة التفاعلية وخطة المنتج المعتمدة | عمار محمد • 2026-11-19</span>
      </div>
      <div class="flex items-center gap-3">
        <button id="resetDemoBtn" type="button" class="text-slate-400 hover:text-emerald-300 underline underline-offset-4 transition" data-i18n="resetDemo">إعادة ضبط بيانات التجربة</button>
      </div>
    </div>
  </footer>

  <!-- Alerts Slide-over Modal -->
  <div id="alertsModal" class="fixed inset-0 z-50 hidden">
    <div id="alertsBackdrop" class="absolute inset-0 bg-black/70"></div>
    <div class="absolute inset-y-0 end-0 w-full max-w-md bg-surface-900 border-s border-slate-800 shadow-2xl flex flex-col glass-modal">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-800">
        <h3 class="text-sm font-bold text-white" data-i18n="alertsTitle">مركز التنبيهات الذكية وسجل التدقيق</h3>
        <button id="closeAlertsBtn" type="button" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-800 hover:text-white">✕</button>
      </div>
      <div id="alertsContent" class="flex-1 overflow-y-auto custom-scroll p-4 space-y-3"></div>
    </div>
  </div>

  <!-- Generic Detail / Form Modal -->
  <div id="appModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="appModalBackdrop" class="absolute inset-0 bg-black/75"></div>
    <div class="relative z-10 w-full max-w-2xl max-h-[88vh] flex flex-col rounded-2xl bg-surface-900 border border-slate-700/80 shadow-2xl overflow-hidden glass-modal">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-800">
        <h3 id="appModalTitle" class="text-base font-bold text-white"></h3>
        <button id="closeAppModalBtn" type="button" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-800 hover:text-white">✕</button>
      </div>
      <div id="appModalBody" class="p-5 overflow-y-auto custom-scroll"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-4 start-4 z-50 flex flex-col gap-2 max-w-sm"></div>

  <!-- Modular Lightweight Application Bundle -->
  <script type="module" src="assets/app.js"></script>
</body>
</html>
