    function normalizeAgentStatus(raw) {
      const val = String(raw || 'idle').toLowerCase().trim();
      if (val === 'waiting' || val === 'waiting_human' || val === 'needs_human') return 'waiting_human';
      if (val === 'working' || val === 'active' || val === 'running' || val === 'busy') return 'working';
      if (val === 'blocked' || val === 'error' || val === 'failed') return 'blocked';
      if (val === 'unresponsive' || val === 'offline' || val === 'stale') return 'unresponsive';
      return 'idle';
    }

    function minutesSinceIso(isoStr) {
      if (!isoStr) return 0;
      const ms = Date.parse(isoStr);
      if (Number.isNaN(ms)) return 0;
      return Math.max(0, Math.round((Date.now() - ms) / 60000));
    }

    function applyAgentHubJson(data, sourceLabel) {
      if (!data || typeof data !== 'object') {
        throw new Error('Invalid JSON root object');
      }

      // Parse agents (array or object map)
      const rawAgents = Array.isArray(data.agents)
        ? data.agents
        : (data.agents && typeof data.agents === 'object'
          ? Object.entries(data.agents).map(([k, v]) => Object.assign({ id: k }, v))
          : []);

      const mappedAgents = rawAgents.map((a, idx) => {
        const id = String(a.id || a.agent_id || a.name || ('agent-' + (idx + 1)));
        const name = String(a.name || id);
        const role = String(a.role || a.description || 'AI Agent');
        const ttl = Number(a.ttl_minutes || a.ttl || 60);
        const lastSeenIso = a.last_seen || a.last_seen_at || a.updated_at || '';
        const mins = lastSeenIso ? minutesSinceIso(lastSeenIso) : 0;
        let st = normalizeAgentStatus(a.status || a.state);
        if (st === 'working' && lastSeenIso && mins > ttl) {
          st = 'unresponsive';
        }
        const connRaw = String(a.connection || a.connection_type || a.channel || '').toLowerCase();
        const conn = connRaw.includes('mail') || connRaw.includes('cue') ? 'email'
          : connRaw.includes('cli') || connRaw.includes('local') ? 'cli' : 'github';
        return {
          id,
          name,
          roleAr: role,
          roleEn: role,
          connection: conn,
          config: a.config || a.source || (lastSeenIso ? ('last_seen: ' + lastSeenIso) : 'agents-state.json'),
          status: st,
          ttlMinutes: ttl,
          minutesAgo: mins,
          activeTaskId: a.current_task || a.active_task || a.task_id || '—',
          color: st === 'working' ? 'emerald' : st === 'waiting_human' ? 'amber' : st === 'unresponsive' ? 'rose' : 'cyan'
        };
      });

      // Parse tasks
      const rawTasks = Array.isArray(data.tasks) ? data.tasks : [];
      const mappedTasks = rawTasks.map((tk, idx) => {
        const id = String(tk.id || tk.task_id || ('T-' + (idx + 1)));
        const title = String(tk.title || tk.name || id);
        const ownerId = String(tk.owner || tk.assignee || tk.owner_agent_id || tk.agent || 'unassigned');
        const stRaw = String(tk.status || tk.state || 'working').toLowerCase();
        const st = (stRaw === 'done' || stRaw === 'completed' || stRaw === 'merged') ? 'completed' : normalizeAgentStatus(stRaw);
        const artifacts = [];
        const prUrl = tk.pr_url || tk.pr || tk.url || tk.link || '';
        if (prUrl) {
          artifacts.push({
            type: 'pr',
            label: prUrl.replace(/^https?:\/\/github\.com\//i, ''),
            url: prUrl,
            checks: tk.checks || stRaw,
            commit: tk.commit || tk.sha || 'github',
            branch: tk.branch || tk.repo || 'main',
            details: JSON.stringify(tk, null, 2)
          });
        }
        if (Array.isArray(tk.artifacts)) {
          tk.artifacts.forEach((ar, aIdx) => {
            artifacts.push({
              type: ar.type || 'link',
              label: ar.label || ar.url || ('Artifact #' + (aIdx + 1)),
              url: ar.url || '',
              checks: ar.checks || 'verified',
              commit: ar.commit || '—',
              branch: ar.branch || 'main',
              details: JSON.stringify(ar, null, 2)
            });
          });
        }
        return {
          id,
          titleAr: title,
          titleEn: title,
          ownerId,
          state: st,
          updatedAt: tk.updated_at || tk.last_updated || tk.created_at || nowTime(),
          summaryAr: tk.summary || tk.notes || tk.description || (prUrl ? ('مرتبط بالرابط الخارجي: ' + prUrl) : 'مهمة حية من agents-state.json'),
          summaryEn: tk.summary || tk.notes || tk.description || (prUrl ? ('Linked PR: ' + prUrl) : 'Live task from agents-state.json'),
          artifacts
        };
      });

      // Parse messages -> liveMessages + handoffs
      const rawMessages = Array.isArray(data.messages) ? data.messages : [];
      const mappedMessages = rawMessages.map((m, idx) => ({
        id: String(m.id || ('MSG-' + (idx + 1))),
        from: String(m.from || m.sender || m.from_agent || 'agent'),
        to: String(m.to || m.recipient || m.to_agent || 'all'),
        taskId: String(m.task_id || m.task || '—'),
        text: String(m.message || m.content || m.body || m.text || m.summary || ''),
        timestamp: String(m.timestamp || m.created_at || m.at || m.date || '')
      }));

      if (mappedAgents.length) state.agents = mappedAgents;
      if (mappedTasks.length) state.tasks = mappedTasks;
      state.liveMessages = mappedMessages;
      state.liveMode = true;
      state.liveLastSync = nowTime();
      state.liveError = null;

      addAudit(
        'ingest',
        sourceLabel || 'github:agent-hub',
        `تمت مزامنة agents-state.json بنجاح (${mappedAgents.length} وكلاء • ${mappedTasks.length} مهام • ${mappedMessages.length} رسائل).`,
        `Synced agents-state.json (${mappedAgents.length} agents • ${mappedTasks.length} tasks • ${mappedMessages.length} messages).`
      );
      renderApp();
    }

    async function fetchLiveAgentHub(silent = false) {
      const urlInput = document.getElementById('liveSourceUrl');
      const targetUrl = (urlInput && urlInput.value.trim()) ? urlInput.value.trim() : state.liveUrl;
      state.liveUrl = targetUrl;
      const btnLabel = document.getElementById('syncLiveBtnLabel');
      if (btnLabel) btnLabel.textContent = isAr() ? 'جارٍ التحديث...' : 'Syncing...';

      try {
        const sep = targetUrl.includes('?') ? '&' : '?';
        const res = await fetch(targetUrl + sep + 't=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        applyAgentHubJson(data, 'github:raw');
        if (!silent) {
          showToast(isAr() ? 'تم تحديث البيانات الحية من GitHub بنجاح' : 'Synced live data from GitHub', 'success');
        }
      } catch (err) {
        state.liveError = String(err && err.message ? err.message : err);
        updateLiveBarUI();
        if (!silent) {
          showToast(
            isAr() ? `تعذر جلب البيانات الحية (${state.liveError}) — يمكنك استخدام استيراد JSON` : `Live fetch failed (${state.liveError}) — use Import JSON`,
            'warning'
          );
        }
      } finally {
        updateLiveBarUI();
      }
    }

          last.textContent = state.liveError

            : 'amiraq1/agent-hub/main/agents-state.json';

    function loadState() {

            return Object.assign(createDefaultState(), parsed);
          }
        }
      } catch (e) {}
      return createDefaultState();

      return String(str || '')

    function showToast(msg, variant = 'success') {
      const container = document.getElementById('toastContainer');
      const colors = {
        success: 'border-emerald-500/50 bg-emerald-950/95 text-emerald-100',
        warning: 'border-amber-500/50 bg-amber-950/95 text-amber-100',
        danger: 'border-rose-500/50 bg-rose-950/95 text-rose-100',

      const el = document.createElement('div');
      el.className = `rounded-xl border px-4 py-3 text-xs font-medium shadow-xl backdrop-blur-md transition-all ${colors[variant] || colors.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 3600);

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(isAr() ? 'تم النسخ إلى الحافظة' : 'Copied to clipboard', 'info');
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(isAr() ? 'تم النسخ إلى الحافظة' : 'Copied to clipboard', 'info');
      } catch (e) {}
      ta.remove();
    }

    // =========================================================================
    // 3. SECRET REDACTION ENGINE (Edge Ingestion Barrier #3)
    // =========================================================================
    function redactSecrets(text) {
      const patterns = [
        { name: 'OpenAI/API Key (sk-...)', regex: /\bsk-[A-Za-z0-9_-]{12,}\b/g },
        { name: 'GitHub Token (ghp_...)', regex: /\bgh[pousr]_[A-Za-z0-9]{16,}\b/g },
        { name: 'AWS Access Key (AKIA...)', regex: /\bAKIA[0-9A-Z]{12,}\b/g },
        { name: 'Bearer Token', regex: /\bBearer\s+[A-Za-z0-9._~+/=-]{10,}/gi },
        { name: 'JWT Token', regex: /\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b/g }
      ];
      let redacted = text;
      const found = [];
      patterns.forEach((p) => {
        const matches = redacted.match(p.regex);
        if (matches && matches.length) {
          found.push(`${p.name} (×${matches.length})`);
          redacted = redacted.replace(p.regex, '[REDACTED]');
        }
      });
      return { redacted, found };
    }

            descEn: `Paused on task ${a.activeTaskId || '—'} waiting for approval.`,

            descEn: `Stuck in ${h.state} for ${h.minutesInState}m without acceptance (SLA ${h.slaMinutes}m).`,
            targetView: 'handoffs'
          });
        }
      });
      return alerts;
    }

    // =========================================================================
    // 8. CHART.JS BREAK-EVEN RENDERER
    // =========================================================================
    function renderBreakEvenChart() {
      const canvas = document.getElementById('breakEvenCanvas');
      if (!canvas || typeof Chart === 'undefined') return;
      if (breakEvenChart) {
        breakEvenChart.destroy();
        breakEvenChart = null;
      }
      const p = state.pricing;
      const maxX = Math.max(20, p.targetSubs + 5);
      const labels = [];
      const revData = [];
      const costData = [];
      for (let x = 0; x <= maxX; x += Math.max(1, Math.floor(maxX / 10))) {
        labels.push(String(x));
        revData.push(Number((x * p.proPrice).toFixed(2)));
        costData.push(Number((p.fixedCost + x * p.varCost).toFixed(2)));
      }
      breakEvenChart = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: isAr() ? 'الإيرادات ($)' : 'Revenue ($)',
              data: revData,
              borderColor: '#34d399',
              backgroundColor: 'rgba(52, 211, 153, 0.12)',
              fill: true,
              tension: 0.25
            },
            {
              label: isAr() ? 'إجمالي التكاليف ($)' : 'Total Costs ($)',
              data: costData,
              borderColor: '#f43f5e',
              borderDash: [5, 5],
              fill: false,
              tension: 0.25
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#cbd5e1', font: { size: 11 } } }
          },
          scales: {
            x: {
              title: { display: true, text: isAr() ? 'عدد مشتركي Pro' : 'Pro Subscribers', color: '#94a3b8' },
              ticks: { color: '#94a3b8' },
              grid: { color: 'rgba(148,163,184,0.08)' }
            },
            y: {
              ticks: { color: '#94a3b8', callback: (v) => '$' + v },
              grid: { color: 'rgba(148,163,184,0.08)' }
            }
          }
        }
      });
    }

    function refreshPipelineAuditUI() {
      const list = document.getElementById('pipelineAuditList');
      const cnt = document.getElementById('pipelineAuditCount');
      if (cnt) cnt.textContent = state.auditEvents.length + ' events';
      if (list) {
        list.innerHTML = state.auditEvents.slice(0, 8).map((ev) => `
          <div class="rounded-lg bg-surface-950/80 border border-slate-800 p-2.5 text-[11px]">
            <div class="flex items-center justify-between font-mono text-[10px] text-slate-400 mb-1">
              <span class="${ev.type === 'alert' ? 'text-rose-400' : ev.type === 'redact' ? 'text-amber-300' : 'text-emerald-400'}">${escapeHtml(ev.actor)}</span>
              <span>${escapeHtml(ev.time)}</span>
            </div>
            <div class="text-slate-300 leading-relaxed">${escapeHtml(isAr() ? ev.msgAr : ev.msgEn)}</div>
          </div>
        `).join('');
      }
      const alertCount = getActiveAlerts().length;
      const badge = document.getElementById('alertsBadge');
      if (badge) badge.textContent = String(alertCount);
    }

    function renderApp() {
      // Update HTML lang/dir
      document.documentElement.lang = state.lang;
      document.documentElement.dir = isAr() ? 'rtl' : 'ltr';
      document.getElementById('langToggleLabel').textContent = isAr() ? 'EN' : 'عربي';

      // Static header/footer translations
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });

      // Nav active state
      const updateNavButtons = (selector) => {
        document.querySelectorAll(selector).forEach((btn) => {
          const v = btn.getAttribute('data-view');
          btn.textContent = t('nav.' + v);
          if (v === state.view) {
            btn.className = selector.includes('mobile')
              ? 'nav-btn-mobile px-3 py-2 rounded-lg text-xs font-bold text-start bg-emerald-500 text-slate-950 transition'
              : 'nav-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-slate-950 transition';
          } else {
            btn.className = selector.includes('mobile')
              ? 'nav-btn-mobile px-3 py-2 rounded-lg text-xs font-medium text-start text-slate-300 hover:bg-slate-800 transition'
              : 'nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/70 transition';
          }
        });
      };
      updateNavButtons('.nav-btn');
      updateNavButtons('.nav-btn-mobile');

      // Alerts badge
      const alertCount = getActiveAlerts().length;
      const badge = document.getElementById('alertsBadge');
      badge.textContent = String(alertCount);
      badge.className = `inline-flex h-5 min-w-[20px] items-center justify-center rounded-full px-1 text-[10px] font-bold text-white ${alertCount ? 'bg-rose-500' : 'bg-emerald-600'}`;

      // Render active view
      const main = document.getElementById('appMain');
      if (state.view === 'overview') main.innerHTML = renderOverview();
      else if (state.view === 'board') main.innerHTML = renderBoard();
      else if (state.view === 'tasks') main.innerHTML = renderTasks();
      else if (state.view === 'handoffs') main.innerHTML = renderHandoffs();
      else if (state.view === 'pipeline') main.innerHTML = renderPipeline();
      else main.innerHTML = renderBlueprint();

      bindViewEvents();
      if (state.view === 'blueprint' && state.blueprintTab === 'pricing') {
        renderBreakEvenChart();
      }
      updateLiveBarUI();
      saveState();
    }

    function bindViewEvents() {
      // Jump buttons
      document.querySelectorAll('[data-jump]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.view = btn.getAttribute('data-jump');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          renderApp();
        });
      });

      // Board filters
      document.querySelectorAll('[data-board-filter]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.boardFilter = btn.getAttribute('data-board-filter');
          renderApp();
        });
      });

      // Heartbeat buttons
      document.querySelectorAll('[data-heartbeat]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-heartbeat');
          const ag = state.agents.find((a) => a.id === id);
          if (!ag) return;
          ag.minutesAgo = 0;
          if (ag.status === 'unresponsive') ag.status = 'working';
          addAudit('ingest', `heartbeat:${ag.name}`, `تم استلام نبضة جديدة من ${ag.name} — تحديث last_seen_at إلى الآن.`, `Heartbeat received from ${ag.name} — updated last_seen_at.`);
          showToast(isAr() ? `تم تحديث نبضة ${ag.name}` : `Heartbeat updated for ${ag.name}`, 'success');
          renderApp();
        });
      });

      // Agent state select
      document.querySelectorAll('[data-agent-state]').forEach((sel) => {
        sel.addEventListener('change', () => {
          const id = sel.getAttribute('data-agent-state');
          const ag = state.agents.find((a) => a.id === id);
          if (!ag) return;
          ag.status = sel.value;
          addAudit(sel.value === 'waiting_human' || sel.value === 'unresponsive' ? 'alert' : 'ingest', `state:${ag.name}`, `تغيير حالة ${ag.name} إلى ${t('states.' + sel.value)}.`, `Changed ${ag.name} state to ${sel.value}.`);
          showToast(isAr() ? `تم تغيير حالة ${ag.name}` : `Updated ${ag.name} state`, 'info');
          renderApp();
        });
      });

      // Simulate TTL expiry
      const simTtlBtn = document.getElementById('simulateTtlBtn');
      if (simTtlBtn) {
        simTtlBtn.addEventListener('click', () => {
          let flipped = 0;
          state.agents.forEach((a) => {
            a.minutesAgo += 35;
            if (a.status === 'working' && a.minutesAgo > a.ttlMinutes) {
              a.status = 'unresponsive';
              flipped++;
              addAudit('alert', 'system:ttl-watchdog', `تجاوز الوكيل ${a.name} مهلة النبض (${a.ttlMinutes}m) ← unresponsive.`, `Agent ${a.name} exceeded ${a.ttlMinutes}m TTL → unresponsive.`);
            }
          });
          showToast(
            flipped
              ? (isAr() ? `رصد النظام ${flipped} وكيلًا غير متجاوب وأطلق تنبيهًا!` : `Detected ${flipped} unresponsive agent(s) and fired alert!`)
              : (isAr() ? 'تقدّم الزمن +35 دقيقة (جميع الوكلاء العاملين ضمن المهلة).' : 'Advanced clock +35m (working agents still within TTL).'),
            flipped ? 'danger' : 'info'
          );
          renderApp();
        });
      }

      // Add Agent Modal
      const addAgentBtn = document.getElementById('addAgentBtn');
      if (addAgentBtn) {
        addAgentBtn.addEventListener('click', () => {
          openModal(isAr() ? 'إضافة وكيل جديد' : 'Register New Agent', `
            <form id="addAgentForm" class="space-y-4 text-xs">
              <div>
                <label class="block text-slate-300 mb-1">${isAr() ? 'اسم الوكيل' : 'Agent Name'}</label>
                <input name="name" required placeholder="e.g. cline-reviewer" class="w-full rounded-xl bg-surface-950 border border-slate-700 px-3 py-2 text-white" />
              </div>
              <div>
                <label class="block text-slate-300 mb-1">${isAr() ? 'الدور' : 'Role'}</label>
                <input name="role" required placeholder="${isAr() ? 'وكيل مراجعة الكود والاختبارات' : 'Code & test review agent'}" class="w-full rounded-xl bg-surface-950 border border-slate-700 px-3 py-2 text-white" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-slate-300 mb-1">${isAr() ? 'طريقة الربط' : 'Connector'}</label>
                  <select name="connection" class="w-full rounded-xl bg-surface-950 border border-slate-700 px-3 py-2 text-white">
                    <option value="github">GitHub agents/{name}.json</option>
                    <option value="email">${isAr() ? 'بريد وارد مُهيكل' : 'Structured Inbound Email'}</option>
                    <option value="cli">API + CLI</option>
                  </select>
                </div>
                <div>
                  <label class="block text-slate-300 mb-1">${isAr() ? 'مهلة النبض (دقائق)' : 'TTL (minutes)'}</label>
                  <input name="ttl" type="number" min="5" max="720" value="60" required class="w-full rounded-xl bg-surface-950 border border-slate-700 px-3 py-2 text-white" />
                </div>
              </div>
              <button type="submit" class="w-full rounded-xl bg-emerald-500 py-2.5 font-bold text-slate-950 hover:bg-emerald-400 transition">
                ${isAr() ? 'حفظ الوكيل' : 'Save Agent'}
              </button>
            </form>
          `);
          document.getElementById('addAgentForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const name = String(fd.get('name')).trim();
            const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-') || ('agent-' + Date.now());
            const conn = String(fd.get('connection'));
            const config = conn === 'github' ? `agents/${id}.json` : conn === 'email' ? `agent_${Math.random().toString(36).slice(2, 8)}@inbound.nabdagents.dev` : 'POST /v1/heartbeat (SHA-256)';
            state.agents.unshift({
              id,
              name,
              roleAr: String(fd.get('role')),
              roleEn: String(fd.get('role')),
              connection: conn,
              config,
              status: 'idle',
              ttlMinutes: Number(fd.get('ttl')) || 60,
              minutesAgo: 0,
              activeTaskId: '—',
              color: 'emerald'
            });
            addAudit('ingest', 'workspace:admin', `إضافة الوكيل الجديد ${name} (${config}).`, `Registered new agent ${name} (${config}).`);
            closeModal();
            showToast(isAr() ? `تمت إضافة الوكيل ${name}` : `Added agent ${name}`, 'success');
            renderApp();
          });
        });
      }

      // Inspect Artifact Modal
      document.querySelectorAll('[data-inspect-task]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const tid = btn.getAttribute('data-inspect-task');
          const idx = Number(btn.getAttribute('data-inspect-idx'));
          const task = state.tasks.find((x) => x.id === tid);
          if (!task || !task.artifacts[idx]) return;
          const art = task.artifacts[idx];
          openModal(`${task.id} — ${art.label}`, `
            <div class="space-y-3 text-xs">
              <div class="grid sm:grid-cols-3 gap-2">
                <div class="rounded-xl bg-surface-950 border border-slate-800 p-3">
                  <div class="text-slate-400 text-[10px]">Checks</div>
                  <div class="font-mono font-bold text-emerald-400 mt-0.5">${escapeHtml(art.checks)}</div>
                </div>
                <div class="rounded-xl bg-surface-950 border border-slate-800 p-3">
                  <div class="text-slate-400 text-[10px]">Branch</div>
                  <div class="font-mono text-cyan-300 mt-0.5">${escapeHtml(art.branch || 'main')}</div>
                </div>
                <div class="rounded-xl bg-surface-950 border border-slate-800 p-3">
                  <div class="text-slate-400 text-[10px]">Commit / Key</div>
                  <div class="font-mono text-slate-200 truncate mt-0.5">${escapeHtml(art.commit || '—')}</div>
                </div>
              </div>
              ${art.url ? `<a href="${escapeHtml(art.url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 rounded-lg bg-cyan-500/15 border border-cyan-500/40 px-3 py-1.5 text-xs font-semibold text-cyan-200 hover:bg-cyan-500/25 transition">↗ ${isAr() ? 'فتح الرابط على GitHub' : 'Open on GitHub'}</a>` : ''}
              <pre dir="ltr" class="rounded-xl bg-surface-950 border border-slate-800 p-4 text-[11px] text-emerald-200 overflow-x-auto custom-scroll whitespace-pre-wrap leading-relaxed">${escapeHtml(art.details)}</pre>
            </div>
          `);
        });
      });

      // Add Task Modal
      const addTaskBtn = document.getElementById('addTaskBtn');
      if (addTaskBtn) {
        addTaskBtn.addEventListener('click', () => {
          openModal(isAr() ? 'إضافة مهمة جديدة بدليل' : 'Create Task with Artifact', `
            <form id="addTaskForm" class="space-y-4 text-xs">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-slate-300 mb-1">${isAr() ? 'معرّف المهمة' : 'Task ID'}</label>
                  <input name="id" required value="T-${47 + state.tasks.length}" class="w-full rounded-xl bg-surface-950 border border-slate-700 px-3 py-2 text-white font-mono" />
                </div>
                <div>
                  <label class="block text-slate-300 mb-1">${isAr() ? 'الوكيل المالك' : 'Owner Agent'}</label>
                  <select name="ownerId" class="w-full rounded-xl bg-surface-950 border border-slate-700 px-3 py-2 text-white">
                    ${state.agents.map((a) => `<option value="${escapeHtml(a.id)}">${escapeHtml(a.name)}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-slate-300 mb-1">${isAr() ? 'عنوان المهمة' : 'Task Title'}</label>
                <input name="title" required placeholder="${isAr() ? 'مثال: التحقق من بوابة الدفع في المرحلة 0' : 'e.g. Verify Phase 0 MoR payout support'}" class="w-full rounded-xl bg-surface-950 border border-slate-700 px-3 py-2 text-white" />
              </div>
              <div>
                <label class="block text-slate-300 mb-1">${isAr() ? 'رابط أو اسم الدليل (Artifact)' : 'Artifact Label / URL'}</label>
                <input name="artifact" required placeholder="PR #281 / report.md" class="w-full rounded-xl bg-surface-950 border border-slate-700 px-3 py-2 text-white" />
              </div>
              <button type="submit" class="w-full rounded-xl bg-emerald-500 py-2.5 font-bold text-slate-950 hover:bg-emerald-400 transition">
                ${isAr() ? 'إنشاء المهمة' : 'Create Task'}
              </button>
            </form>
          `);
          document.getElementById('addTaskForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const id = String(fd.get('id')).trim();
            const title = String(fd.get('title')).trim();
            const ownerId = String(fd.get('ownerId'));
            const artLabel = String(fd.get('artifact')).trim();
            state.tasks.unshift({
              id,
              titleAr: title,
              titleEn: title,
              ownerId,
              state: 'working',
              updatedAt: '2026-11-19 ' + nowTime().slice(0, 5),
              summaryAr: 'تمت إضافة المهمة يدويًا وربطها بالوكيل المالك.',
              summaryEn: 'Task created and linked to owner agent.',
              artifacts: [{ type: 'link', label: artLabel, checks: 'pending', commit: 'manual', branch: 'main', details: `Artifact: ${artLabel}\nOwner: ${ownerId}` }]
            });
            addAudit('ingest', 'workspace:admin', `إنشاء المهمة ${id} وإسنادها إلى ${ownerId}.`, `Created task ${id} assigned to ${ownerId}.`);
            closeModal();
            showToast(isAr() ? `تمت إضافة المهمة ${id}` : `Created task ${id}`, 'success');
            renderApp();
          });
        });
      }

      // Advance Handoff State
      document.querySelectorAll('[data-advance-handoff]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-advance-handoff');
          const h = state.handoffs.find((x) => x.id === id);
          if (!h) return;
          const stages = ['sent', 'received', 'accepted', 'completed'];
          const idx = stages.indexOf(h.state);
          if (idx < stages.length - 1) {
            h.state = stages[idx + 1];
            h.minutesInState = 0;
            addAudit('ingest', `handoff:${h.id}`, `انتقال التسليم ${h.id} (${h.taskId}) إلى حالة ${t('handoffStates.' + h.state)}.`, `Advanced handoff ${h.id} (${h.taskId}) to ${h.state}.`);
            showToast(isAr() ? `تمت ترقية ${h.id} إلى ${t('handoffStates.' + h.state)}` : `Advanced ${h.id} to ${h.state}`, 'success');
            renderApp();
          }
        });
      });

      // Loop Guard Simulator
      const simLoopBtn = document.getElementById('simLoopGuardBtn');
      if (simLoopBtn) {
        simLoopBtn.addEventListener('click', () => {
          const ag = state.agents.find((a) => a.id === 'muse') || state.agents[0];
          if (ag) ag.status = 'waiting_human';
          const task = state.tasks.find((tItem) => tItem.id === 'T-42');
          if (task) task.state = 'waiting_human';
          addAudit('alert', 'system:loop-guard', 'كبح حلقة لانهائية: تم رصد 6 تسليمات بين nabd-coder وMuse على T-42 خلال 10 دقائق ← تجميد التوجيه وتحويل المهمة إلى waiting_human.', 'Loop Guard triggered: 6 handoffs between nabd-coder & Muse on T-42 within 10m → routing frozen, moved to waiting_human.');
          showToast(isAr() ? '⚡ تم تفعيل Loop Guard وتجميد المهمة T-42 إلى waiting_human!' : '⚡ Loop Guard triggered: T-42 frozen to waiting_human!', 'danger');
          renderApp();
        });
      }

      // New Handoff Modal
      const newHandoffBtn = document.getElementById('newHandoffBtn');
      if (newHandoffBtn) {
        newHandoffBtn.addEventListener('click', () => {
          openModal(isAr() ? 'تسجيل تسليم موثّق جديد' : 'Record New Handoff', `
            <form id="newHandoffForm" class="space-y-4 text-xs">
              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="block text-slate-300 mb-1">${isAr() ? 'المهمة' : 'Task'}</label>
                  <select name="taskId" class="w-full rounded-xl bg-surface-950 border border-slate-700 px-2.5 py-2 text-white">
                    ${state.tasks.map((tk) => `<option value="${escapeHtml(tk.id)}">${escapeHtml(tk.id)}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-slate-300 mb-1">${isAr() ? 'من وكيل' : 'From'}</label>
                  <select name="fromId" class="w-full rounded-xl bg-surface-950 border border-slate-700 px-2.5 py-2 text-white">
                    ${state.agents.map((a) => `<option value="${escapeHtml(a.id)}">${escapeHtml(a.name)}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-slate-300 mb-1">${isAr() ? 'إلى وكيل' : 'To'}</label>
                  <select name="toId" class="w-full rounded-xl bg-surface-950 border border-slate-700 px-2.5 py-2 text-white">
                    ${state.agents.slice().reverse().map((a) => `<option value="${escapeHtml(a.id)}">${escapeHtml(a.name)}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-slate-300 mb-1">${isAr() ? 'ملخص التسليم والدليل' : 'Handoff Summary & Proof'}</label>
                <textarea name="summary" rows="3" required placeholder="${isAr() ? 'اذكر نتيجة الفحص أو رابط الدليل...' : 'Include check results or artifact link...'}" class="w-full rounded-xl bg-surface-950 border border-slate-700 p-2.5 text-white"></textarea>
              </div>
              <button type="submit" class="w-full rounded-xl bg-emerald-500 py-2.5 font-bold text-slate-950 hover:bg-emerald-400 transition">
                ${isAr() ? 'تسجيل التسليم (Sent)' : 'Create Handoff (Sent)'}
              </button>
            </form>
          `);
          document.getElementById('newHandoffForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const rawSummary = String(fd.get('summary'));
            const { redacted, found } = redactSecrets(rawSummary);
            const id = 'H-' + (101 + state.handoffs.length);
            const key = 'key-' + Math.random().toString(36).slice(2, 9);
            state.handoffs.unshift({
              id,
              taskId: String(fd.get('taskId')),
              fromId: String(fd.get('fromId')),
              toId: String(fd.get('toId')),
              state: 'sent',
              idempotencyKey: key,
              minutesInState: 0,
              slaMinutes: 15,
              summaryAr: redacted,
              summaryEn: redacted
            });
            state.seenKeys.push(key);
            if (found.length) {
              addAudit('redact', 'edge:secret-redactor', `تم حجب أسرار (${found.join(', ')}) تلقائيًا قبل حفظ التسليم ${id}.`, `Auto-redacted secrets (${found.join(', ')}) before saving handoff ${id}.`);
            }
            addAudit('ingest', `handoff:${id}`, `تسليم جديد ${id} من ${fd.get('fromId')} إلى ${fd.get('toId')}.`, `New handoff ${id} from ${fd.get('fromId')} to ${fd.get('toId')}.`);
            closeModal();
            showToast(found.length ? (isAr() ? 'تم حفظ التسليم بعد حجب أسرار حساسة تلقائيًا!' : 'Handoff saved after auto-redacting secrets!') : (isAr() ? `تم تسجيل التسليم ${id}` : `Recorded handoff ${id}`), found.length ? 'warning' : 'success');
            renderApp();
          });
        });
      }

      // Pipeline Mode Switch & Execution
      document.querySelectorAll('[data-pipe-mode]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.pipelineMode = btn.getAttribute('data-pipe-mode');
          renderApp();
        });
      });

      const copyPayloadBtn = document.getElementById('copyPayloadBtn');
      if (copyPayloadBtn) {
        copyPayloadBtn.addEventListener('click', () => {
          const ta = document.getElementById('pipelineInput');
          if (ta) copyText(ta.value);
        });
      }

      const runPipelineBtn = document.getElementById('runPipelineBtn');
      if (runPipelineBtn) {
        runPipelineBtn.addEventListener('click', () => {
          const input = document.getElementById('pipelineInput').value;
          const validSig = document.getElementById('pipeValidSig').checked;
          const resultBox = document.getElementById('pipelineResultBox');

          // Gate 1: Identity
          if (!validSig) {
            addAudit('alert', 'edge:auth-gate', 'رفض طلب وارد: فشل التحقق من التوقيع (HMAC-SHA256 / SPF-DKIM).', 'Rejected inbound payload: failed signature check (HMAC-SHA256 / SPF-DKIM).');
            resultBox.innerHTML = `
              <div class="rounded-xl border border-rose-500/50 bg-rose-500/10 p-4 text-xs space-y-1.5">
                <div class="font-bold text-rose-300">✕ GATE 01 BLOCKED — 401 Unauthorized</div>
                <p class="text-slate-300">${isAr() ? 'تم رفض الحدث في Cloudflare Worker قبل لمس قاعدة البيانات بسبب فشل التحقق من الهوية.' : 'Blocked at Cloudflare Worker before DB write due to failed identity verification.'}</p>
              </div>
            `;
            showToast(isAr() ? 'رفضت البوابة الحدث: توقيع غير صالح' : 'Blocked: invalid signature', 'danger');
            refreshPipelineAuditUI();
            saveState();
            return;
          }

          // Extract Idempotency Key
          let key = '';
          const keyMatch = input.match(/"idempotency_key"\s*:\s*"([^"]+)"/) || input.match(/Message-ID:\s*(\S+)/i);
          key = keyMatch ? keyMatch[1] : ('auto-' + Date.now());

          // Gate 2: Idempotency
          if (state.seenKeys.includes(key)) {
            addAudit('ingest', 'edge:idempotency', `تجاهل حدث مكرر يحمل نفس المفتاح (${key}).`, `Ignored duplicate event with existing idempotency key (${key}).`);
            resultBox.innerHTML = `
              <div class="rounded-xl border border-amber-500/50 bg-amber-500/10 p-4 text-xs space-y-1.5">
                <div class="font-bold text-amber-300">⊘ GATE 02 DUPLICATE — 200 Idempotent Skip</div>
                <p class="text-slate-300">${isAr() ? `المفتاح ${escapeHtml(key)} مسجل مسبقًا — تم منع التكرار بنجاح. غيّر المفتاح لإعادة التجربة.` : `Key ${escapeHtml(key)} already processed — duplicate skipped cleanly. Change key to re-test.`}</p>
              </div>
            `;
            showToast(isAr() ? 'تم منع التكرار بنجاح (Idempotency)' : 'Duplicate skipped cleanly', 'warning');
            refreshPipelineAuditUI();
            saveState();
            return;
          }

          // Gate 3: Secret Redaction
          const { redacted, found } = redactSecrets(input);
          state.seenKeys.push(key);
          if (found.length) {
            addAudit('redact', 'edge:secret-redactor', `حجب تلقائي للأسرار: ${found.join(' • ')} قبل التخزين.`, `Auto-redacted secrets: ${found.join(' • ')} before DB write.`);
          }
          addAudit('ingest', `edge:${state.pipelineMode}`, `قبول وتحديث السجل عبر ${state.pipelineMode} (key: ${key}).`, `Accepted and persisted ${state.pipelineMode} payload (key: ${key}).`);

          resultBox.innerHTML = `
            <div class="space-y-3 text-xs">
              <div class="rounded-xl border border-emerald-500/40 bg-emerald-500/10 p-3.5">
                <div class="font-bold text-emerald-300">✓ PASSED ALL 4 EDGE GATES (201 Persisted)</div>
                <div class="mt-1 text-slate-300">
                  Idempotency Key: <span class="font-mono text-cyan-300">${escapeHtml(key)}</span><br/>
                  ${isAr() ? 'الأسرار المحجوبة:' : 'Redacted Secrets:'}
                  <strong class="${found.length ? 'text-amber-300' : 'text-emerald-300'}">${found.length ? escapeHtml(found.join(', ')) : (isAr() ? 'لا توجد أسرار' : 'None')}</strong>
                </div>
              </div>
              <div>
                <div class="text-[11px] text-slate-400 mb-1">${isAr() ? 'المحتوى المنقّح المحفوظ في قاعدة البيانات:' : 'Sanitized Payload Stored in DB:'}</div>
                <pre dir="ltr" class="rounded-xl bg-surface-950 border border-slate-800 p-3 text-[11px] text-amber-200 max-h-44 overflow-auto custom-scroll whitespace-pre-wrap">${escapeHtml(redacted)}</pre>
              </div>
            </div>
          `;
          showToast(isAr() ? 'اجتاز الحدث جميع البوابات الأربعة بنجاح' : 'Payload passed all 4 edge gates', 'success');
          refreshPipelineAuditUI();
          saveState();
        });
      }

      // Blueprint Subtabs
      document.querySelectorAll('[data-bp-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.blueprintTab = btn.getAttribute('data-bp-tab');
          renderApp();
        });
      });

      // Copy System Prompt Template
      const copyPromptBtn = document.getElementById('copyPromptTemplateBtn');
      if (copyPromptBtn) {
        copyPromptBtn.addEventListener('click', () => {
          const code = document.getElementById('promptTemplateCode');
          if (code) copyText(code.textContent);
        });
      }

      // Pricing Sliders
      const bindSlider = (id, key, isFloat = false) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', () => {
          state.pricing[key] = isFloat ? parseFloat(el.value) : parseInt(el.value, 10);
          renderApp();
        });
      };
      bindSlider('slFixed', 'fixedCost');
      bindSlider('slPrice', 'proPrice');
      bindSlider('slVar', 'varCost', true);
      bindSlider('slSubs', 'targetSubs');
    }

    // =========================================================================
    // 10. GLOBAL HEADER / MODAL LISTENERS
    // =========================================================================
    document.querySelectorAll('.nav-btn, .nav-btn-mobile').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.view = btn.getAttribute('data-view');
        document.getElementById('mobileNav').classList.add('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderApp();
      });
    });

    document.getElementById('brandHomeBtn').addEventListener('click', () => {
      state.view = 'overview';
      renderApp();
    });

    document.getElementById('langToggleBtn').addEventListener('click', () => {
      state.lang = isAr() ? 'en' : 'ar';
      renderApp();
    });

    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      document.getElementById('mobileNav').classList.toggle('hidden');
    });

    document.getElementById('alertsBtn').addEventListener('click', openAlertsDrawer);
    document.getElementById('closeAlertsBtn').addEventListener('click', () => {
      document.getElementById('alertsModal').classList.add('hidden');
    });
    document.getElementById('alertsBackdrop').addEventListener('click', () => {
      document.getElementById('alertsModal').classList.add('hidden');
    });

    document.getElementById('closeAppModalBtn').addEventListener('click', closeModal);
    document.getElementById('appModalBackdrop').addEventListener('click', closeModal);

    document.getElementById('resetDemoBtn').addEventListener('click', () => {
      try { localStorage.removeItem('nabd_agents_state_v1'); } catch (e) {}
      state = createDefaultState();
      showToast(isAr() ? 'تمت إعادة ضبط بيانات التجربة' : 'Demo data reset', 'info');
      renderApp();
    });

    document.getElementById('syncLiveBtn').addEventListener('click', () => {
      fetchLiveAgentHub(false);
    });

    document.getElementById('autoRefreshToggle').addEventListener('change', (e) => {
      state.autoRefresh = Boolean(e.target.checked);
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
      if (state.autoRefresh) {
        autoRefreshTimer = setInterval(() => fetchLiveAgentHub(true), 30000);
        showToast(isAr() ? 'تم تفعيل التحديث التلقائي كل 30 ثانية' : 'Auto-refresh enabled (30s)', 'info');
      } else {
        showToast(isAr() ? 'تم إيقاف التحديث التلقائي' : 'Auto-refresh paused', 'info');
      }
    });

    document.getElementById('importJsonBtn').addEventListener('click', () => {
      openModal(isAr() ? 'استيراد agents-state.json يدويًا' : 'Import agents-state.json Manually', `
        <form id="importJsonForm" class="space-y-4 text-xs">
          <p class="text-slate-400">${isAr() ? 'الصق محتوى ملف agents-state.json من مستودع amiraq1/agent-hub لعرضه فورًا في اللوحة.' : 'Paste your agents-state.json payload to load it directly into the dashboard.'}</p>
          <textarea name="rawJson" rows="10" dir="ltr" required placeholder='{"agents": [...], "tasks": [...], "messages": [...]}' class="w-full rounded-xl bg-surface-950 border border-slate-700 p-3 font-mono text-xs text-emerald-200"></textarea>
          <button type="submit" class="w-full rounded-xl bg-emerald-500 py-2.5 font-bold text-slate-950 hover:bg-emerald-400 transition">
            ${isAr() ? 'تحميل وعرض البيانات' : 'Load & Render State'}
          </button>
        </form>
      `);
      document.getElementById('importJsonForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const parsed = JSON.parse(String(fd.get('rawJson')));
          applyAgentHubJson(parsed, 'manual:json-import');
          closeModal();
          showToast(isAr() ? 'تم استيراد agents-state.json بنجاح' : 'Imported agents-state.json successfully', 'success');
        } catch (err) {
          showToast(isAr() ? 'خطأ في صيغة JSON: ' + err.message : 'Invalid JSON: ' + err.message, 'danger');
        }
      });
    });

    // Boot
    renderApp();
    fetchLiveAgentHub(true);
  </script>
</body>
</html>
